# File purpose:
# - Model routing and backend configuration.
#
# Key classes/functions:
# - backends.model_router.ModelRouter
#
# Inputs/outputs:
# - Input: task-type to model-role mapping
# - Output: selected model id per call
#
# Dependencies:
# - backends/ollama_client.py, backends/model_router.py
#
# Modification guide:
# - Safe places to edit: model names, fallbacks
# - Risky places to edit: role keys expected by code
# - Related files: backends/model_router.py, .env.example
#
# The default branch is the registered local vLLM endpoint. The backend fallback
# is OpenAI API so Windows or Linux deployments can still run with an API key
# when local inference is unavailable or intentionally skipped.

backend:
  default: vllm
  fallback: openai

models:
  orchestrator:
    primary: endpoint:local-main
  worker:
    primary: endpoint:local-main
# Capabilities belong to the selected endpoint in system.yaml, not a role name.
backend_models:
  openai:
    orchestrator:
      primary: endpoint:api-main
    worker:
      primary: endpoint:api-main
  vllm:
    orchestrator:
      primary: endpoint:local-main
    worker:
      primary: endpoint:local-main

task_routes:
  orchestrator_plan: orchestrator
  orchestrator_supervisor: orchestrator
  design_reasoning: worker
  specimen_reasoning: worker
  analysis_reasoning: worker
  bo_policy: worker
  knowledge_query: worker
  knowledge_relation: worker
  guardian_reasoning: worker
  guardian_review: worker
  vision_observation: worker
  manipulation_plan: worker
  tool_formatting: worker
  equipment_workflow_decision: worker
  gui_helper: worker
  module_designer: orchestrator
