schema: ax4lab.geometry_provider.v1
id: gyroid
version: 1.0.0
label: Gyroid
representations: [sheet]
default_representation: sheet
engine: legacy_gyroid
stochastic: false
orientation_axes: [z]
fields:
  - {key: cell_size_mm, label: Cell size, type: number, min: 0.1, max: 200, unit: mm}
  - {key: wall_thickness_mm, label: Target wall thickness, type: number, min: 0.05, max: 50, unit: mm}
  - {key: anisotropy_ratio, label: Z anisotropy ratio, type: number, min: 0.5, max: 2}
  - {key: defect_ratio, label: Random voxel defect fraction, type: number, min: 0, max: 0.35}
  - {key: skin_thickness_mm, label: Cap thickness, type: number, min: 0, max: 20, unit: mm}
  - {key: top_cap_enabled, label: Top cap, type: boolean}
  - {key: bottom_cap_enabled, label: Bottom cap, type: boolean}
defaults:
  cell_size_mm: 5.0
  wall_thickness_mm: 0.8
  anisotropy_ratio: 1.0
  defect_ratio: 0.0
  skin_thickness_mm: 0.0
  top_cap_enabled: false
  bottom_cap_enabled: false
