schema: ax4lab.geometry_provider.v1
agent_handoff: true
id: gyroid
version: 1.0.0
label: Gyroid
representations: [sheet, network_positive, network_negative]
default_representation: sheet
engine: legacy_gyroid
stochastic: false
orientation_axes: [z]
representation_orientation_axes:
  sheet: [z]
  network_positive: [x, y, z]
  network_negative: [x, y, z]
fields:
  - {key: cell_size_mm, label: Cell size, type: number, min: 0.1, max: 200, unit: mm, description: "Conventional periodic cell edge length; sets feature spacing, not specimen dimensions."}
  - {key: wall_thickness_mm, label: Target wall thickness, type: number, min: 0.05, max: 50, unit: mm, description: "Full physical target wall thickness; finite sampling and curved junctions affect the realized local wall."}
  - {key: anisotropy_ratio, label: Z anisotropy ratio, type: number, min: 0.5, max: 2, description: "Legacy Gyroid z-axis scaling ratio; 1 retains the baseline isotropic scale."}
  - {key: defect_ratio, label: Random voxel defect fraction, type: number, min: 0, max: 0.35, description: "Fraction of randomly removed legacy Gyroid voxels; nonzero values require an explicit seed."}
  - {key: skin_thickness_mm, label: Cap thickness, type: number, min: 0, max: 20, unit: mm, description: "Thickness of optional legacy Gyroid end caps; zero disables added cap thickness."}
  - {key: top_cap_enabled, label: Top cap, type: boolean, description: "Enable the legacy Gyroid top end cap when cap thickness is positive."}
  - {key: bottom_cap_enabled, label: Bottom cap, type: boolean, description: "Enable the legacy Gyroid bottom end cap when cap thickness is positive."}
defaults:
  cell_size_mm: 5.0
  wall_thickness_mm: 0.8
  anisotropy_ratio: 1.0
  defect_ratio: 0.0
  skin_thickness_mm: 0.0
  top_cap_enabled: false
  bottom_cap_enabled: false
representation_parameters:
  network_positive:
    fields:
      - {key: cell_size_mm, label: Cell size, type: number, min: 0.1, max: 200, unit: mm, description: "Conventional periodic cell edge length; sets feature spacing, not specimen dimensions."}
      - {key: iso_level, label: Dimensionless iso level, type: number, min: -2, max: 2, description: "Dimensionless implicit-field threshold; not a wall thickness or a directly prescribed density."}
    defaults: {cell_size_mm: 12, iso_level: 0}
  network_negative:
    fields:
      - {key: cell_size_mm, label: Cell size, type: number, min: 0.1, max: 200, unit: mm, description: "Conventional periodic cell edge length; sets feature spacing, not specimen dimensions."}
      - {key: iso_level, label: Dimensionless iso level, type: number, min: -2, max: 2, description: "Dimensionless implicit-field threshold; not a wall thickness or a directly prescribed density."}
    defaults: {cell_size_mm: 12, iso_level: 0}
design_family: tpms
parameter_roles:
  cell_size_mm: design
  wall_thickness_mm: design
  anisotropy_ratio: fixed
  defect_ratio: fixed
  skin_thickness_mm: fixed
  top_cap_enabled: fixed
  bottom_cap_enabled: fixed
  iso_level: design
default_basis: "Editable project starting values for a 30 mm specimen crop, not universal optima or paper-calibrated material properties."
design_notes:
  - "Sheet mode uses a physical target wall thickness; network modes use a dimensionless iso level and expose no wall-thickness input."
  - "Cell size and iso level do not prescribe exact relative density; inspect the generated mesh volume fraction."
  - "Implicit approximations and finite-grid wall sampling are implementation limits, not validated physical performance."
  - "Gyroid sheet retains the legacy writer, z-only orientation, adaptive sampling and optional caps/voxel defects; network modes use the field engine."
research_sources:
  - title: "TPMSgen: shell and skeletal TPMS parameterizations"
    url: https://github.com/albertforesg/TPMSgen
