schema: ax4lab.geometry_provider.v1
id: reentrant_honeycomb
version: 1.0.0
label: reentrant honeycomb
representations: [extruded_wall]
default_representation: extruded_wall
stochastic: false
fields:
  - {key: inclined_length_mm, label: Inclined wall length, type: number, min: 0.1, max: 200, unit: mm}
  - {key: vertical_length_mm, label: Vertical wall length, type: number, min: 0.1, max: 200, unit: mm}
  - {key: angle_deg, label: Signed angle from horizontal, type: number, min: -75, max: -5, unit: deg}
  - {key: wall_thickness_mm, label: Full wall thickness, type: number, min: 0.1, max: 20, unit: mm}
defaults: {inclined_length_mm: 6, vertical_length_mm: 14, angle_deg: -30, wall_thickness_mm: 1.4}
