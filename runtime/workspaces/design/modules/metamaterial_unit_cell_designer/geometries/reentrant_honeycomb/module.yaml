schema: ax4lab.geometry_provider.v1
agent_handoff: true
id: reentrant_honeycomb
version: 1.0.0
label: Reentrant Honeycomb
representations: [extruded_wall]
default_representation: extruded_wall
stochastic: false
fields:
  - {key: inclined_length_mm, label: Inclined wall length, type: number, min: 0.1, max: 200, unit: mm, description: "Centerline length of an inclined honeycomb wall."}
  - {key: vertical_length_mm, label: Vertical wall length, type: number, min: 0.1, max: 200, unit: mm, description: "Centerline length of a vertical honeycomb wall."}
  - {key: angle_deg, label: Signed angle from horizontal, type: number, min: -75, max: -5, unit: deg, description: "Signed angle of inclined walls measured from horizontal; negative angles form reentrant cells."}
  - {key: wall_thickness_mm, label: Full wall thickness, type: number, min: 0.1, max: 20, unit: mm, description: "Full physical target wall thickness; finite sampling and curved junctions affect the realized local wall."}
defaults: {inclined_length_mm: 6, vertical_length_mm: 14, angle_deg: -30, wall_thickness_mm: 1.4}
design_family: honeycomb
parameter_roles:
  inclined_length_mm: design
  vertical_length_mm: design
  angle_deg: design
  wall_thickness_mm: design
default_basis: "Editable project starting values for a 30 mm specimen crop, not universal optima or paper-calibrated material properties."
design_notes:
  - "Inclined and vertical wall centerline lengths, signed angle and full wall thickness control the planar cell."
  - "Specimen z dimension controls extrusion crop; it is separate from planar unit-cell geometry."
  - "Negative angles create the reentrant geometry; elastic auxetic behavior is not established by the STL alone."
research_sources:
  - title: "Reentrant honeycomb geometry and auxetic behavior"
    url: https://onlinelibrary.wiley.com/doi/full/10.1002/pssb.70282
