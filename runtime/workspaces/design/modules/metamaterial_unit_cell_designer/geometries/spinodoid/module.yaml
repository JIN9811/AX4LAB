schema: ax4lab.geometry_provider.v1
id: spinodoid
version: 1.0.0
label: Spinodoid
representations: [grf]
default_representation: grf
stochastic: true
fields:
  - {key: wavelength_mm, label: GRF wavelength, type: number, min: 1, max: 200, unit: mm}
  - {key: wave_count, label: Wave count, type: integer, min: 16, max: 512}
  - {key: cone_angles_deg, label: Double-cone half angles (zero disables), type: vector, length: 3, min: 0, max: 90, unit: deg}
  - {key: solid_fraction, label: Expected solid fraction, type: number, min: 0.1, max: 0.9}
defaults: {wavelength_mm: 12, wave_count: 64, cone_angles_deg: [90, 90, 90], solid_fraction: 0.55}
