schema: ax4lab.geometry_provider.v1
agent_handoff: true
id: fischer_koch_s
version: 1.0.0
label: Fischer-Koch S
representations: [sheet, network_positive, network_negative]
default_representation: sheet
fields:
  - {key: cell_size_mm, label: Cell size, type: number, min: 0.1, max: 200, unit: mm}
  - {key: wall_thickness_mm, label: Target wall thickness, type: number, min: 0.05, max: 20, unit: mm}
defaults: {cell_size_mm: 16.666666666666668, wall_thickness_mm: 1.4}
representation_parameters:
  network_positive:
    fields:
      - {key: cell_size_mm, label: Cell size, type: number, min: 0.1, max: 200, unit: mm}
      - {key: iso_level, label: Dimensionless iso level, type: number, min: -2, max: 2}
    defaults: {cell_size_mm: 12, iso_level: 0}
  network_negative:
    fields:
      - {key: cell_size_mm, label: Cell size, type: number, min: 0.1, max: 200, unit: mm}
      - {key: iso_level, label: Dimensionless iso level, type: number, min: -2, max: 2}
    defaults: {cell_size_mm: 12, iso_level: 0}
