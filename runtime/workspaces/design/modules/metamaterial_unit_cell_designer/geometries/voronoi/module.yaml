schema: ax4lab.geometry_provider.v1
agent_handoff: true
id: voronoi
version: 1.0.0
label: Voronoi
representations: [strut]
default_representation: strut
stochastic: true
fields:
  - {key: site_count, label: Interior site count, type: integer, min: 8, max: 128, description: "Number of interior random Voronoi sites; boundary guard sites are added internally."}
  - {key: strut_diameter_mm, label: Strut diameter, type: number, min: 0.1, max: 50, unit: mm, description: "Full circular strut diameter, not radius; junction unions change measured solid fraction."}
defaults: {site_count: 16, strut_diameter_mm: 2}
design_family: voronoi
parameter_roles:
  site_count: design
  strut_diameter_mm: design
default_basis: "Editable project starting values for a 30 mm specimen crop, not universal optima or paper-calibrated material properties."
design_notes:
  - "Site count and full strut diameter control a seeded random Voronoi-edge scaffold; relative density is a measured output, not an independent input."
  - "The project default uses 16 interior sites and 2 mm struts for a 30 mm crop. Reported study combinations such as 80/122 sites and 0.7/1/1.3 mm struts are not copied as universal defaults."
  - "This provider adds boundary guard sites and does not implement the cited study's short-edge merging; numerical comparisons are not direct reproductions."
  - "Seed selects a repeatable site realization; boundary clipping and junction unions affect volume fraction."
research_sources:
  - title: "Voronoi lattice design with site count and strut diameter"
    url: https://link.springer.com/article/10.1007/s40964-025-01274-3
default_seed: 42
