schema: ax4lab.serial_device.v1
id: cas_mwii_plus
version: 1.0.0
label: CAS MWII Plus
icon: icon.svg
capabilities: [read, polling]
defaults: {port: '', baudrate: 9600, bytesize: 8, parity: N, stopbits: 1, flow_control: none, variant: print_text, timeout_s: 10, stale_after_s: 5, interval_s: 1}
fields:
  - {key: port, label: Port, type: port}
  - {key: baudrate, label: Baud rate, type: select, options: [2400, 4800, 9600, 19200, 38400, 57600, 115200]}
  - {key: bytesize, label: Data bits, type: select, options: [7, 8]}
  - {key: parity, label: Parity, type: select, options: [N, E, O]}
  - {key: stopbits, label: Stop bits, type: select, options: [1, 2]}
  - {key: flow_control, label: Flow control, type: select, options: [none, rtscts, xonxoff]}
  - {key: variant, label: Format, type: select, options: [print_text]}
  - {key: timeout_s, label: Response timeout (s), type: number, min: 0.1, max: 30, step: 0.1}
  - {key: stale_after_s, label: Stale after (s), type: number, min: 0.1, max: 3600, step: 0.1}
  - {key: interval_s, label: Request interval (s), type: number, min: 0.2, max: 3600, step: 0.1}
channels:
  - {key: weight, label: Weight}
source: CAS MWII Plus manual, pp. 17–24
