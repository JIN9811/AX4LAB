<section class="knowledge-source-upload" data-knowledge-upload aria-label="Manual upload">
  <div class="knowledge-source-drop" data-source-drop>
    <div><strong>Manuals</strong><p>Drop files here</p></div>
    <button class="btn mini" type="button" data-source-choose>Upload</button>
    <input type="file" data-source-file hidden multiple accept=".pdf,.docx,.md,.txt,.csv,.json,.yaml,.yml,.html,.htm" aria-label="Choose manuals" />
  </div>
  <p class="knowledge-source-upload-message" data-source-message role="status"></p>
  <div class="knowledge-source-upload-footer"><small data-source-worker>Loading…</small><a href="/knowledge#manuals" target="_blank" rel="noopener">Source Library ↗</a></div>
  <ul data-source-files aria-label="Knowledge source processing"></ul>
</section>
